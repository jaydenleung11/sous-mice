<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#view{margin:0;height:100%;overflow:hidden}#view{position:relative}#phase{position:fixed;top:16px;left:16px;padding:12px 18px;background:#281f30e8;border:1px solid #b98b58;border-radius:12px;color:#ffe7ba;font:700 18px Nunito;pointer-events:none}#phase small{display:block;font-size:11px;color:#d0bcb7;margin-top:4px}</style></head><body><div id="view"></div><div id="phase"></div><script type="module">
import '@fontsource/nunito/latin-700.css';import {Scene3D} from '../scene3d.ts';import {createWorld} from '../../shared/sim.ts';import {movePlayer3D} from '../../shared/controller3d.ts';import {MAP3D,TRAVERSALS3D} from '../../shared/content3d.ts';import {BUTTON} from '../../shared/constants.ts';import {settings3d} from '../settings3d.ts';import {settings} from '../settings.ts';
settings3d.quality='high';settings3d.comfortCamera=true;settings3d.shake=0;settings3d.vignette=false;settings.muted=true;
const scene=new Scene3D();await scene.init(document.querySelector('#view'));const world=createWorld([{id:'mouse',name:'Pip',team:'mouse',classId:'scout',bot:false,ready:true,connected:true},{id:'chef',name:'Bram',team:'chef',classId:'head',bot:false,ready:true,connected:true}],{mode:'3d',duration:480,bots:false,difficulty:'easy'},42);world.guests=[];world.orders=[];world.pickups=[];const p=world.players[0],chef=world.players[1],stages=[[2,'Idle'],[4,'Walk'],[6,'Sprint'],[8,'Turn and stop'],[10,'Jump / flip / landing'],[13,'Climb'],[16,'Carry'],[19,'Eat / interrupted action'],[21,'Capture / held'],[23,'Caged'],[25,'Rescue'],[27,'Drop while moving'],[31,'Sprint → jump → turn → land'],[33,'Drag oversized wheel'],[35,'Drag oversized crate']];let running=false,t=0,index=-1,last=performance.now(),samples=[];
function reset(){Object.assign(p,{x:9,y:21,z:0,angle:0,vz:0,vx:0,vy:0,grounded:true,state:'free',stateUntil:0,carry:undefined,action:undefined,traversal:undefined,layer:'floor',hidden:undefined,cooldowns:{controllerTime:world.time},stamina:100});Object.assign(chef,{x:12,y:21,z:0,angle:Math.PI,state:'free',holding:undefined});}
function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(running){t+=dt;world.time+=dt;}let i=stages.findIndex(([end])=>t<end);if(i<0){running=false;i=stages.length-1;}const begin=i?stages[i-1][0]:0,a=t-begin;if(i!==index){index=i;reset();if(i===5)Object.assign(p,TRAVERSALS3D.find(t=>t.id==='table-1-climb').from);if(i===8){Object.assign(chef,{x:9,y:20.7,angle:Math.PI/2,holding:p.id});Object.assign(p,{state:'held',x:9,y:21.06,z:.97});}if(i===9)Object.assign(p,{...MAP3D.cages[0],state:'caged'});if(i===10)world.events.push({id:world.nextId++,kind:'rescue',text:'Free!',time:world.time,x:p.x,y:p.y,z:0});}
 if(i===8&&a>1.2&&p.state==='held'){Object.assign(p,{state:'free',z:0,grounded:true,vz:0});chef.holding=undefined;}
 let mx=0,my=0,buttons=0,yaw=p.angle;
 if(i===1)mx=1;if(i===2){mx=1;buttons=BUTTON.SPRINT;}if(i===3){yaw=a*Math.PI;mx=a<1?Math.cos(yaw):0;my=a<1?Math.sin(yaw):0;}if(i===4){mx=.4;yaw=a>1.25?.9:0;buttons=(a>.15&&a<.25)||(a>1.25&&a<1.35)?BUTTON.JUMP:0;}
 if(i===5&&(p.z<.74||p.traversal)){mx=1;buttons=BUTTON.USE;}
 if(i===6){p.carry='cheese';mx=a<1.2?.3:0;}if(i===7){p.carry=a<1.5?'cheese':undefined;p.action=a<1.4?{kind:'eat',target:'cheese',progress:a,duration:1.5}:undefined;}
 if(i===11){p.carry=a<.85?'tomato':undefined;mx=.4;}if(i===12){mx=.7;my=a>1.35?.5:0;yaw=a>1.35?.65:0;buttons=BUTTON.SPRINT|((a>1.2&&a<1.3)||(a>2.2&&a<2.3)?BUTTON.JUMP:0);}
 if(i===13||i===14){p.carry=i===13?'wheel':'crate';mx=.35;}
 if(running)movePlayer3D(p,{mx,my,buttons,yaw,seq:world.tick++,tick:world.tick,ax:0,ay:0},dt,world);
 scene.setLook(new URLSearchParams(location.search).has('front')?p.angle+Math.PI:i===5?0:.30,-.04);const s={type:'snap',mode:'3d',selfId:p.id,ackSeq:0,...world,entities:world.players};scene.draw(s,world.players,p,dt);document.querySelector('#phase').innerHTML=t.toFixed(2)+'s · '+stages[i][1]+'<small>Local animation review · controller-driven movement; capture/rescue are state fixtures</small>';
 if(running){const c=scene.actors.get(p.id)?.model;samples.push({t,stage:i,x:p.x,y:p.y,z:p.z,grounded:p.grounded,vz:p.vz,angle:p.angle,yaw:c?.root.rotation.y,flip:c?.pose?.rotation.x||0,bodyY:c?.body.position.y,carry:p.carry,camera:scene.metrics().cameraPosition});}requestAnimationFrame(frame);
}reset();requestAnimationFrame(frame);window.motion={scene,world,samples,start:()=>{t=0;world.time=0;index=-1;samples.length=0;running=true;},reduced:v=>settings.reduced=v,done:()=>!running&&t>34};
</script></body></html>
