<!doctype html><html><head><style>body{margin:0;background:transparent}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {BistroMaterials} from './materials.ts';import {character,animateCharacter} from './models.ts';
