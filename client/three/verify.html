<!doctype html><html><head><link rel="icon" href="/icon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}#view{position:relative}</style></head><body><div id="view"></div><script type="module">
import '@fontsource/nunito/latin-700.css';import '@fontsource/fredoka/latin-600.css';
import {Scene3D} from '../scene3d.ts';import {createWorld} from '../../shared/sim.ts';import {settings3d} from '../settings3d.ts';
const scene=new Scene3D();await scene.init(document.querySelector('#view'));const world=createWorld([{id:'mouse',name:'Pip',team:'mouse',classId:'scout',ready:true,bot:false,connected:true},{id:'chef',name:'Bram',team:'chef',classId:'head',ready:true,bot:false,connected:true}],{duration:480,bots:false,mode:'3d',difficulty:'easy'},42);let self=world.players[0];const snap=()=>({type:'snap',mode:'3d',selfId:self.id,ackSeq:0,...world,entities:world.players});let stopped=false,last=performance.now();function draw(now){const dt=Math.min(.06,(now-last)/1000);last=now;world.time+=dt;scene.draw(snap(),world.players,self,dt);if(!stopped)requestAnimationFrame(draw);}requestAnimationFrame(draw);window.verify={scene,world,settings3d,look:(yaw,pitch)=>scene.setLook(yaw,pitch),self:(id)=>self=world.players.find(p=>p.id===id),stop:()=>stopped=true};
</script></body></html>
