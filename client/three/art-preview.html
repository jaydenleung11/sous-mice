<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4ddbd}header{position:absolute;top:35px;left:50px;color:#724a36;font:600 32px Fredoka}header small{display:block;font:700 14px Nunito;letter-spacing:3px;margin-bottom:10px}</style></head><body><header><small>SOUS MICE · ART PREVIEW</small>A little mouse. A delicious adventure.</header><script type="module">
import * as T from 'three';
import '@fontsource/nunito/latin-700.css';import '@fontsource/fredoka/latin-600.css';
import {BistroMaterials,shadowTexture} from './materials';import {food,character} from './models';
await document.fonts.ready;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#f4ddbd');scene.add(new T.HemisphereLight('#fff0d0','#90726b',2.5));const key=new T.DirectionalLight('#ffe0b6',3);key.position.set(-2,4,5);scene.add(key);
const m=new BistroMaterials(),floor=new T.Mesh(new T.PlaneGeometry(4,4),m.flat('gallery-floor','#eed3ac'));floor.rotation.x=-Math.PI/2;floor.position.y=-.008;scene.add(floor);
const shadow=new T.MeshBasicMaterial({map:shadowTexture(),transparent:true,depthWrite:false});
for(const [i,id]of ['cheese','tomato','vegetable','mushroom','garlic','chili','honey'].entries()){
 const model=food(m,id);model.position.set((i%4-1.5)*.24,0,Math.floor(i/4)*.24);model.rotation.y=-.5;model.scale.setScalar(1.7);scene.add(model);
 const shade=new T.Mesh(new T.PlaneGeometry(.22,.18),shadow);shade.rotation.x=-Math.PI/2;shade.position.set(model.position.x,-.004,model.position.z);scene.add(shade);
}
const mouse=character(m,'mouse','scout');mouse.root.position.set(.25,0,.24);mouse.root.scale.setScalar(1.9);mouse.root.rotation.y=-.45;scene.add(mouse.root);
const camera=new T.PerspectiveCamera(40,innerWidth/innerHeight,.01,20);camera.position.set(.45,.8,1.35);camera.lookAt(0,.08,.1);renderer.render(scene,camera);window.artReady=true;
</script></body></html>
